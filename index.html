<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4. Kompanie Bahnhofstraße – Jagdhund-Zähler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <!-- Logo: "logo.svg" liegt neben index.html. Eigenes Logo einbinden?
         Datei ersetzen (gleicher Dateiname) oder src unten anpassen. -->
    <img class="logo" src="logo.svg" alt="Logo 100 Jahre Schützen vom Bahnhof – 4. Kompanie"
         onerror="this.hidden=true; document.getElementById('logo').hidden=false;">
    <div class="logo-placeholder" id="logo" hidden>LOGO</div>
    <div class="header-text">
      <h1>4. Kompanie Bahnhofstraße</h1>
      <p class="subtitle">Jagdhund-Zähler</p>
    </div>
  </header>

  <main class="dashboard">

    <section class="counter-card">
      <p class="counter-label">Getrunkene Jagdhunde</p>
      <p class="counter-value" id="counterValue">0</p>
      <p class="last-drink" id="lastDrink">Letzter Jagdhund: –</p>
    </section>

    <section class="actions">
      <button class="btn btn-primary" id="incrementBtn">Jagdhund +1</button>
      <div class="actions-secondary">
        <button class="btn btn-minus" id="decrementBtn">-1</button>
        <button class="btn btn-reset" id="resetBtn">Zurücksetzen</button>
      </div>
    </section>

    <section class="chart-card">
      <p class="chart-title">Verlauf</p>
      <canvas id="chart" class="chart-canvas"></canvas>
    </section>

  </main>

  <div class="locomotive-popup" id="locomotivePopup">
    <span class="locomotive-popup-emoji">🚂</span>
    <span class="locomotive-popup-text">Stand: <span id="locomotivePopupCount">0</span></span>
  </div>

  <div class="modal-overlay" id="confirmOverlay">
    <div class="modal">
      <p>Zähler wirklich auf 0 zurücksetzen?</p>
      <div class="modal-actions">
        <button class="btn btn-reset" id="confirmResetBtn">Ja, zurücksetzen</button>
        <button class="btn btn-cancel" id="cancelResetBtn">Abbrechen</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
